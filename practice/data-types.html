<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Data Types Crash Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one column of bento tiles. Header tile, topic tabs, vocab tile, then 5 exercise tiles per topic. */
:root{
  --page:#EDE7FF; --tile:#FFFFFF; --ink:#1B1B1B; --text:#1B1B1B; --muted:#4A4560;
  --line:#1B1B1B; --accent:#C8B6FF;
  --butter:#FFE98A; --mint:#B8F2D0; --sky:#A8D8FF; --peach:#FFC9A8; --pink:#FF8FA3;
  --code-bg:#1B1B1B; --code-fg:#F5F0FF; --c-str:#B8F2D0; --c-num:#FFC9A8; --c-fn:#A8D8FF; --c-op:#FFE98A;
  --good:#1E7A3A; --bad:#A3203A;
  --f-head:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-code:"Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-tile:28px; --r-inner:16px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#14122B; --tile:#221E45; --text:#F5F0FF; --muted:#C9C2E8; --line:#C8B6FF;
    --code-bg:#0E0C1F; --good:#8BE0A0; --bad:#FF9BAE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#14122B; --tile:#221E45; --text:#F5F0FF; --muted:#C9C2E8; --line:#C8B6FF;
  --code-bg:#0E0C1F; --good:#8BE0A0; --bad:#FF9BAE; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--page); color:var(--text); font-family:var(--f-head); font-size:18px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:24px 64px}
.wrap{max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:24px}
.wrap > *{min-width:0}
#topic{width:100%}
h1,h2,h3{font-weight:800; line-height:1.05; margin:0; text-wrap:balance}
h1{font-size:clamp(2rem, 5vw, 3rem)}
h2{font-size:1.75rem}
h3{font-size:1.25rem}
p{margin:0}
code,.mono{font-family:var(--f-code)}
.tile{background:var(--tile); border:3px solid var(--line); border-radius:var(--r-tile); box-shadow:6px 6px 0 var(--line); padding:24px; display:flex; flex-direction:column; gap:16px; min-width:0}
.head-row{display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-start}
.head-text{flex:1 1 320px; display:flex; flex-direction:column; gap:8px; min-width:0}
.how{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:2px}
.sub{color:var(--muted)}
.label{font-size:.8rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase}

/* buttons */
button{font:inherit; color:var(--ink); cursor:pointer}
.btn{min-height:44px; padding:8px 20px; border:3px solid var(--line); border-radius:var(--r-pill); background:var(--tile); color:var(--text);
  font-weight:600; box-shadow:5px 4px 0 var(--line); transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(4px,4px); box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent); color:var(--ink); border-color:var(--ink); box-shadow:5px 4px 0 var(--ink)}
.btn.primary:hover{box-shadow:0 0 0 var(--ink)}
:focus-visible{outline:4px solid var(--sky); outline-offset:3px}
.btn-row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

/* progress */
.progress{display:flex; flex-direction:column; gap:8px}
.segs{display:flex; gap:12px; flex-wrap:wrap}
.prog-text{font-weight:600; font-size:1rem}
.seg-group{display:flex; gap:4px}
.seg{width:20px; height:14px; border:2px solid var(--line); border-radius:var(--r-pill); background:transparent}
.seg.on{background:var(--mint); border-color:var(--ink)}

/* tabs */
.tabs{display:flex; flex-wrap:wrap; gap:12px}
.tab{min-height:48px; padding:8px 20px; border:3px solid var(--line); border-radius:var(--r-pill); background:var(--tile); color:var(--text); font-weight:600;
  box-shadow:5px 4px 0 var(--line); display:flex; gap:10px; align-items:center; text-decoration:none}
.tab .n{font-family:var(--f-code); font-weight:700}
.tab[aria-current="page"]{background:var(--butter); color:var(--ink); border-color:var(--ink); box-shadow:5px 4px 0 var(--ink)}
.tab .count{font-family:var(--f-code); font-size:.85rem}

/* vocab */
.vocab{background:var(--butter); color:var(--ink); border-color:var(--ink); box-shadow:6px 6px 0 var(--ink)}
.vocab dl{margin:0; display:flex; flex-direction:column; gap:14px}
.vocab dl > div{display:grid; grid-template-columns:minmax(0,13rem) 1fr; gap:4px 20px; align-items:baseline; padding-top:12px; border-top:2px solid var(--ink)}
.vocab dl > div:first-child{border-top:0; padding-top:0}
.vocab dt{font-weight:800; font-size:1.1rem}
.vocab dd{margin:0}
.vocab code{background:var(--tile); color:var(--text); border:2px solid var(--ink); border-radius:8px; padding:0 6px; white-space:nowrap}

/* code panel */
.code{margin:0; background:var(--code-bg); color:var(--code-fg); border-radius:var(--r-inner); padding:14px 18px; font-family:var(--f-code); font-size:1rem;
  overflow-x:auto; white-space:pre; border:3px solid var(--ink)}
.t-str{color:var(--c-str)} .t-num{color:var(--c-num)} .t-fn{color:var(--c-fn)} .t-op{color:var(--c-op); font-weight:700}
.inline-code{font-family:var(--f-code); background:var(--code-bg); color:var(--code-fg); border-radius:6px; padding:1px 6px; white-space:nowrap}

/* exercise */
.ex-top{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.ex-kind{display:flex; gap:10px; align-items:center}
.ex-num{width:36px; height:36px; border-radius:50%; border:3px solid var(--line); display:grid; place-items:center; font-weight:800}
.status{display:flex; gap:6px; align-items:center; font-weight:600; border:2px solid var(--ink); border-radius:var(--r-pill); padding:2px 12px; color:var(--ink); background:var(--mint)}
.ex.done{border-color:var(--ink)}
.ex.done .ex-num{background:var(--mint); color:var(--ink); border-color:var(--ink)}
.prompt{font-size:1.15rem; font-weight:600; max-width:65ch}
.prompt code{font-family:var(--f-code); font-weight:400; font-size:.95em; background:var(--code-bg); color:var(--code-fg); border-radius:6px; padding:1px 6px; white-space:nowrap}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-weight:600}
.answer{width:100%; min-height:48px; padding:10px 14px; border:3px solid var(--line); border-radius:var(--r-inner); background:var(--tile); color:var(--text);
  font-family:var(--f-code); font-size:1rem; line-height:1.45; display:block; resize:none; overflow:hidden; overflow-wrap:anywhere}

/* sort rows */
.sort-list{display:grid; grid-template-columns:max-content 1fr; list-style:none; margin:0; padding:0}
.sort-row{display:contents}
.sort-row > *{padding-block:10px; border-bottom:2px dashed var(--line)}
.sort-row:last-child > *{border-bottom:0}
.sort-cell{display:flex; align-items:center; padding-right:20px}
.sort-val{min-width:0}
.choices{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.choice{min-height:44px; min-width:96px; padding:6px 14px; border:3px solid var(--line); border-radius:var(--r-pill); background:var(--tile); color:var(--text); font-weight:600}
.choice[aria-pressed="true"]{background:var(--sky); color:var(--ink); border-color:var(--ink)}
.choice[aria-pressed="true"]::before{content:"\2713  "}
.mark{display:inline-flex; gap:4px; align-items:center; font-weight:600; min-width:88px}
.mark.ok{color:var(--good)} .mark.no{color:var(--bad)}

/* feedback */
.feedback{display:flex; gap:10px; align-items:flex-start; font-weight:600; min-height:0}
.feedback:empty{display:none}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.feedback svg{flex:none; margin-top:3px}
.why{background:var(--mint); color:var(--ink); border:3px solid var(--ink); border-radius:var(--r-inner); padding:14px 18px; display:flex; flex-direction:column; gap:8px}
.why .code{border-color:var(--ink)}
.why.reveal{background:var(--peach)}
.next-row{display:flex; justify-content:flex-end; align-items:center; flex-wrap:wrap; gap:16px}
.topic-done{font-weight:600; display:flex; gap:6px; align-items:center}
.foot{color:var(--muted); font-size:.9rem; text-align:center}
.clear-btn{background:none; border:0; color:var(--muted); text-decoration:underline; min-height:44px; padding:0 8px; font-size:.9rem}

@media (prefers-reduced-motion: reduce){ .btn,.tab{transition:none} .btn:hover{transform:none} }
@media (max-width:560px){ .tile{padding:18px} body{font-size:17px} .choice{min-width:72px}
  .sort-list{grid-template-columns:1fr} .sort-cell{border-bottom:0 !important; padding-bottom:0}
  .vocab dl > div{grid-template-columns:1fr} }
</style>
</head>
<body>

<main class="wrap">
  <header class="tile">
    <div class="head-row">
      <div class="head-text">
        <h1>Data Types Crash Course</h1>
        <p class="sub">5 topics, 25 short exercises, about 25 minutes.</p>
        <ol class="how">
          <li>Read the vocab at the top of each topic.</li>
          <li>Do each exercise, then click Check.</li>
          <li>Stuck after 2 tries? Click Show answer.</li>
        </ol>
      </div>
      <button class="btn" id="fsBtn" type="button">Full screen</button>
    </div>
    <div class="progress">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <p id="progText" class="prog-text"></p>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Topics"></nav>
  <section id="topic" class="wrap" style="max-width:none" aria-live="off"></section>

  <p class="foot">Your progress saves in this browser. <button class="clear-btn" id="clearBtn" type="button">Clear my progress</button></p>
</main>

<script>
const TOPICS = [
  { id:"strings", name:"Strings",
    vocab:[
      ["string", "Text. It always has quotes around it, like <code>\"Hello\"</code>."],
      ["quotes", "They mark where a string starts and ends. The quotes do not show on the screen."],
      ["Why use strings?", "For names, messages, element IDs, and any words your app shows."]
    ]},
  { id:"numbers", name:"Numbers",
    vocab:[
      ["number", "A value you can do math with. It has no quotes, like <code>7</code> or <code>9.99</code>."],
      ["<code>\"7\"</code> vs <code>7</code>", "They look alike. <code>\"7\"</code> is a string. <code>7</code> is a number."],
      ["getText vs getNumber", "<code>getText</code> gives a string. <code>getNumber</code> gives a number you can do math with."]
    ]},
  { id:"concat", name:"Concatenation",
    vocab:[
      ["concatenation", "Joining strings into one string with <code>+</code>."],
      ["When does + join?", "If either side is a string, <code>+</code> joins. Only two numbers get added."],
      ["Spaces", "<code>+</code> never adds a space. Put the space inside the quotes, like <code>\"Hi \"</code>."]
    ]},
  { id:"operators", name:"Operators",
    vocab:[
      ["operator", "A symbol that does math: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide, <code>%</code> remainder."],
      ["<code>%</code> remainder", "What is left over after dividing. <code>17 % 5</code> is 2, because 5 goes into 17 three times with 2 left."],
      ["Order of operations", "App Lab does <code>*</code> <code>/</code> <code>%</code> before <code>+</code> <code>-</code>. Parentheses always go first."]
    ]},
  { id:"math", name:"Math statements",
    vocab:[
      ["Math.round", "Rounds a number to the nearest whole number. <code>Math.round(4.6)</code> is 5. A .5 rounds up."],
      ["randomNumber(min, max)", "Gives a random whole number from min to max. Both ends can come up. <code>randomNumber(1, 6)</code> can give 1, 6, or anything between."],
      ["Why use them?", "Math.round cleans up prices and averages. randomNumber makes dice and games turn out different each time."]
    ]}
];

const KIND = { sort:"Sort", show:"What shows?", write:"Write the line", fix:"Fix the bug" };

const EX = [
  // ---------- STRINGS ----------
  { id:"s1", topic:"strings", kind:"sort", prompt:"Is each value a string or a number? Click one for each.",
    options:["String","Number"],
    items:[['"Hello"',0],['42',1],['"42"',0],['3.5',1],['"3.5"',0],['"Hi there"',0]],
    why:'Quotes make a string. <code>"42"</code> is a string, even though it has digits in it.' },
  { id:"s2", topic:"strings", kind:"show", prompt:"What shows in the console?",
    code:'console.log("Go team");', answers:["Go team"],
    why:"The quotes tell App Lab where the string starts and ends. The console does not show them." },
  { id:"s3", topic:"strings", kind:"write", prompt:"Show the word Hello in the console. Use <code>console.log</code>.",
    answers:['console.log("Hello")'],
    hints:[[/console\.log\(\s*Hello\s*\)/, "Hello is text, so it needs quotes around it."]],
    why:"Text needs quotes. Without them, App Lab looks for something named Hello and finds nothing.",
    model:'console.log("Hello");' },
  { id:"s4", topic:"strings", kind:"fix", prompt:"This line gives an error. Fix it so the console shows Good morning.",
    code:'console.log(Good morning);', answers:['console.log("Good morning")'],
    why:"Without quotes, App Lab thinks Good is a name it should look up. Quotes tell it this is text.",
    model:'console.log("Good morning");' },
  { id:"s5", topic:"strings", kind:"write", prompt:"Make <code>labelTitle</code> show the text Welcome. Use <code>setText</code>.",
    answers:['setText("labelTitle","Welcome")'],
    hints:[[/setText\(\s*labelTitle/, "The element ID is a string too. Put quotes around labelTitle."],
           [/,\s*Welcome\s*\)/, "Welcome is text, so it needs quotes."]],
    why:"setText takes two strings. The first is the element ID. The second is the text to show.",
    model:'setText("labelTitle", "Welcome");' },

  // ---------- NUMBERS ----------
  { id:"n1", topic:"numbers", kind:"sort", prompt:"Is each value a string or a number? Click one for each.",
    options:["String","Number"],
    items:[['7',1],['"7"',0],['0',1],['-2',1],['"ten"',0],['9.99',1]],
    why:'Numbers have no quotes. <code>"ten"</code> is a word in quotes, so it is a string.' },
  { id:"n2", topic:"numbers", kind:"show", prompt:"What shows in the console?",
    code:'console.log(8 + 2);', answers:["10"],
    wrong:{"8 + 2":"There are no quotes here. These are numbers, so App Lab does the math.", "82":"There are no quotes. Two numbers get added, not joined."},
    why:"8 and 2 are numbers. With two numbers, + adds them." },
  { id:"n3", topic:"numbers", kind:"show", prompt:"What shows in the console? Look closely at the quotes.",
    code:'console.log("8 + 2");', answers:["8 + 2"],
    wrong:{"10":"Look at the quotes. Everything inside them is a string.", "82":"Everything is inside one pair of quotes. App Lab shows it exactly as typed."},
    why:"Everything inside the quotes is one string. App Lab shows it exactly as typed and does no math." },
  { id:"n4", topic:"numbers", kind:"write", prompt:"Show 6 times 7 in the console. Let App Lab do the math.",
    answers:['console.log(6*7)','console.log(7*6)'],
    hints:[[/\d\s*[xX×]\s*\d/, "In code, multiply uses *, not x."],
           [/"/, "Numbers need no quotes. With quotes, App Lab shows the text and does no math."],
           [/42/, "Let App Lab do the math. Use 6 and 7 in your line."]],
    why:"* means multiply. There are no quotes, so App Lab does the math and shows 42.",
    model:'console.log(6 * 7);' },
  { id:"n5", topic:"numbers", kind:"fix", prompt:"A student types 14 into <code>text_inputAge</code>. This line shows 141, not 15. Fix it.",
    code:'console.log(getText("text_inputAge") + 1);', answers:['console.log(getNumber("text_inputAge")+1)'],
    hints:[[/getText/, "getText still gives a string. Which statement gives a number?"],
           [/getNumber\(\s*text_inputAge/, "The element ID is a string. Keep the quotes around text_inputAge."]],
    why:'getText gives the string <code>"14"</code>, and <code>"14" + 1</code> joins to make 141. getNumber gives the number 14, so + adds.',
    model:'console.log(getNumber("text_inputAge") + 1);' },

  // ---------- CONCATENATION ----------
  { id:"c1", topic:"concat", kind:"sort", prompt:"Does each + join strings or add numbers? Click one for each.",
    options:["Joins","Adds"],
    items:[['5 + 5',1],['"5" + "5"',0],['"Age: " + 14',0],['3 + 4',1],['"5" + 5',0],['getNumber("text_inputA") + 2',1]],
    why:"If either side of + is a string, + joins. Only two numbers get added. getNumber gives a number." },
  { id:"c2", topic:"concat", kind:"show", prompt:"What shows in the console?",
    code:'console.log("5" + "5");', answers:["55"],
    wrong:{"10":"Both values have quotes. They are strings, so + joins them.", "5 5":"+ never adds a space."},
    why:"Both values are strings. + joins them side by side to make 55." },
  { id:"c3", topic:"concat", kind:"show", prompt:"What shows in the console? Watch the spaces.",
    code:'console.log("Score: " + 10);', answers:["Score: 10"],
    wrong:{"Score:10":"Look inside the quotes. There is a space after the colon."},
    why:'"Score: " is a string, so + joins the 10 onto the end. The space inside the quotes keeps them apart.' },
  { id:"c4", topic:"concat", kind:"fix", prompt:"This line shows HelloSam. Fix it so it shows Hello Sam.",
    code:'console.log("Hello" + "Sam");',
    answers:['console.log("Hello "+"Sam")','console.log("Hello"+" Sam")','console.log("Hello"+" "+"Sam")'],
    hints:[[/^\s*console\.log\(\s*"Hello\s+Sam"\s*\)\s*;?\s*$/, "That shows Hello Sam, but keep the + and join two strings."]],
    why:"+ never adds a space. Put the space inside the quotes, at the end of \"Hello \" or the start of \" Sam\".",
    model:'console.log("Hello " + "Sam");' },
  { id:"c5", topic:"concat", kind:"write", prompt:"Make <code>labelGreeting</code> show Hi, a space, then the name typed in <code>text_inputName</code>. Use one line.",
    answers:['setText("labelGreeting","Hi "+getText("text_inputName"))'],
    hints:[[/getText\(\s*text_inputName/, "The element ID needs quotes. Write getText(\"text_inputName\")."],
           [/setText\(\s*labelGreeting/, "The element ID needs quotes. Write \"labelGreeting\"."],
           [/getNumber/, "A name is text, not a number. Use getText."],
           [/"Hi"\s*\+/, "Add a space inside the quotes after Hi."],
           [/"Hi,/, "Use just Hi and a space, with no comma."]],
    why:"getText gives the name as a string. + joins it after \"Hi \". The space inside the quotes keeps the words apart.",
    model:'setText("labelGreeting", "Hi " + getText("text_inputName"));' },

  // ---------- OPERATORS ----------
  { id:"o1", topic:"operators", kind:"sort", prompt:"What does each operator do? Click one for each.",
    options:["Add","Subtract","Multiply","Divide","Remainder"],
    items:[['8 - 3',1],['8 * 3',2],['8 % 3',4],['8 + 3',0],['8 / 2',3]],
    why:"* is multiply and / is divide. % gives the remainder, what is left over after dividing." },
  { id:"o2", topic:"operators", kind:"show", prompt:"What shows in the console?",
    code:'console.log(17 % 5);', answers:["2"],
    wrong:{"3.4":"That is 17 / 5. % gives what is left over, not the division answer.", "3":"5 goes into 17 three times. What is left over?", "15":"5 goes into 17 three times, which is 15. What is left over?"},
    why:"5 goes into 17 three times, which makes 15. 17 minus 15 leaves 2. That leftover is the remainder." },
  { id:"o3", topic:"operators", kind:"show", prompt:"What shows in the console? Think about which operator goes first.",
    code:'console.log(2 + 3 * 4);', answers:["14"],
    wrong:{"20":"App Lab multiplies before it adds. Do 3 * 4 first."},
    why:"App Lab does * before +. 3 * 4 is 12, then 2 + 12 is 14." },
  { id:"o4", topic:"operators", kind:"write", prompt:"Show the average of 80 and 90 in the console. Add them, then divide by 2.",
    answers:['console.log((80+90)/2)','console.log((90+80)/2)'],
    hints:[[/^\s*console\.log\(\s*(80\s*\+\s*90|90\s*\+\s*80)\s*\/\s*2\s*\)/, "Without parentheses, App Lab divides first. Put ( ) around the two numbers you add."],
           [/85/, "Let App Lab do the math. Use 80, 90, and 2 in your line."],
           [/"/, "Numbers need no quotes. With quotes, App Lab shows the text and does no math."],
           [/÷/, "In code, divide uses /."]],
    why:"Parentheses go first, so 80 + 90 makes 170. Then 170 / 2 is 85.",
    model:'console.log((80 + 90) / 2);' },
  { id:"o5", topic:"operators", kind:"fix", prompt:"Tickets cost $4 each. A student types 3 into <code>text_inputTickets</code>. This shows Total: $34. Fix it so it shows Total: $12.",
    code:'setText("labelTotal", "Total: $" + getNumber("text_inputTickets") + 4);',
    answers:['setText("labelTotal","Total: $"+getNumber("text_inputTickets")*4)','setText("labelTotal","Total: $"+(getNumber("text_inputTickets")*4))'],
    hints:[[/getText/, "getText gives a string. Keep getNumber so App Lab can do math."],
           [/\+\s*\(\s*getNumber\([^)]*\)\s*\+\s*4\s*\)/, "That adds 4. Tickets cost $4 each, so multiply."],
           [/\+\s*4\s*\)?\s*\)\s*;?\s*$/, "The last + joins, because the left side is a string. Which operator multiplies?"]],
    why:'* goes before +, so App Lab does 3 * 4 first and gets 12. Then + joins 12 onto "Total: $".',
    model:'setText("labelTotal", "Total: $" + getNumber("text_inputTickets") * 4);' },

  // ---------- MATH STATEMENTS ----------
  { id:"m1", topic:"math", kind:"sort", prompt:"Does each one give the same value every time, or can it change? Click one for each.",
    options:["Same every time","Can change"],
    items:[['Math.round(4.6)',0],['randomNumber(1, 6)',1],['6 * 7',0],['randomNumber(0, 1)',1],['Math.round(9.99)',0]],
    why:"randomNumber picks a new number each time it runs. Math.round and operators give the same answer every time." },
  { id:"m2", topic:"math", kind:"show", prompt:"What shows in the console?",
    code:'console.log(Math.round(4.6));', answers:["5"],
    wrong:{"4":"Math.round goes to the nearest whole number. 4.6 is closer to 5.", "4.6":"Math.round changes 4.6 into a whole number."},
    why:"4.6 is closer to 5 than to 4, so Math.round gives 5." },
  { id:"m3", topic:"math", kind:"show", prompt:"What shows in the console? The * is nested inside Math.round.",
    code:'console.log(Math.round(7.25 * 2));', answers:["15"],
    wrong:{"14":"7.25 * 2 is 14.5. A .5 rounds up.", "14.5":"That is 7.25 * 2. Now Math.round makes it a whole number.", "7":"Do the nested part first. 7.25 * 2 is 14.5."},
    why:"App Lab does the nested part first. 7.25 * 2 is 14.5. Then Math.round rounds the .5 up to 15." },
  { id:"m4", topic:"math", kind:"write", prompt:"Make <code>labelRoll</code> show a random number from 1 to 100. Use <code>randomNumber</code>.",
    answers:['setText("labelRoll",randomNumber(1,100))'],
    hints:[[/"randomNumber/, "With quotes, labelRoll shows the word randomNumber. Take those quotes off so App Lab runs it."],
           [/Math\.random/, "In App Lab, use randomNumber(1, 100)."],
           [/setText\(\s*labelRoll/, "The element ID is a string. Put quotes around labelRoll."],
           [/randomNumber\(\s*100\s*,\s*1\s*\)/, "Put the smallest number first, then the biggest."],
           [/randomNumber\(\s*0\s*,/, "The task says from 1 to 100. Start at 1."]],
    why:"randomNumber(1, 100) picks a new whole number each time. setText puts it on labelRoll.",
    model:'setText("labelRoll", randomNumber(1, 100));' },
  { id:"m5", topic:"math", kind:"fix", prompt:"This dice roll sometimes shows 0. A die only has 1 to 6. Fix it.",
    code:'console.log(randomNumber(0, 6));', answers:['console.log(randomNumber(1,6))'],
    hints:[[/randomNumber\(\s*0\s*,\s*5\s*\)/, "Now it can never show 6. Both numbers can come up, so use 1 and 6."],
           [/randomNumber\(\s*1\s*,\s*7\s*\)/, "Now it can show 7. Both numbers can come up, so use 1 and 6."],
           [/randomNumber\(\s*6\s*,\s*1\s*\)/, "Put the smallest number first."]],
    why:"randomNumber includes both numbers. randomNumber(1, 6) can give 1, 2, 3, 4, 5, or 6, just like a die.",
    model:'console.log(randomNumber(1, 6));' }
];

/* ---------- state ---------- */
const KEY = "icp-dtcc-v1";
let state = { done:{} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.done) state = s; } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const misses = {};
const draft = {};
const picks = {};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
const ICON_OK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>';
const ICON_NO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function highlight(src){
  const frag = document.createDocumentFragment();
  const re = /("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)|(-?\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w.]*)(?=\s*\()|([+\-*/%])/g;
  let last = 0, m;
  while ((m = re.exec(src))){
    if (m.index > last) frag.append(src.slice(last, m.index));
    const cls = m[1] ? "t-str" : m[2] ? "t-num" : m[3] ? "t-fn" : "t-op";
    frag.append(el("span", {class:cls}, m[0]));
    last = re.lastIndex;
  }
  frag.append(src.slice(last));
  return frag;
}
function codeBlock(src){ const p = el("pre", {class:"code"}); p.append(highlight(src)); return p; }

/* Normalize a line of code: drop spaces outside strings, use double quotes, drop trailing semicolons. */
function normalize(src){
  let out = "", i = 0, open = false;
  src = src.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  while (i < src.length){
    const c = src[i];
    if (c === '"' || c === "'"){
      let j = i + 1, body = "";
      while (j < src.length && src[j] !== c){ body += src[j]; j++; }
      if (j >= src.length){ open = true; out += '"' + body; break; }
      out += '"' + body.replace(/"/g, '\\"') + '"';
      i = j + 1; continue;
    }
    if (!/\s/.test(c)) out += c;
    i++;
  }
  out = out.replace(/;+$/, "");
  return { code: out, open };
}
function stripStrSpaces(s){ return s.replace(/"[^"]*"/g, m => m.replace(/\s+/g, "")); }

/* ---------- checking ---------- */
function checkCode(ex, raw){
  if (!raw.trim()) return { ok:false, msg:"Type a line of code first." };
  const n = normalize(raw);
  const answers = ex.answers;
  if (answers.includes(n.code)) return { ok:true };
  if (ex.kind === "fix" && n.code === normalize(ex.code).code) return { ok:false, msg:"This is still the broken line. Change something, then click Check." };
  if (n.open) return { ok:false, msg:"A string is missing a quote. Every string needs a quote at the start and the end." };
  const opens = (n.code.replace(/"[^"]*"/g,"").match(/\(/g)||[]).length, closes = (n.code.replace(/"[^"]*"/g,"").match(/\)/g)||[]).length;
  if (opens !== closes) return { ok:false, msg:"Check the parentheses. Every ( needs a matching )." };
  for (const [re, msg] of (ex.hints||[])) if (re.test(raw)) return { ok:false, msg };
  if (answers.some(a => a.toLowerCase() === n.code.toLowerCase())) return { ok:false, msg:"Check capital letters. Code must match exactly, like getText with a capital T." };
  if (answers.some(a => stripStrSpaces(a) === stripStrSpaces(n.code))) return { ok:false, msg:"Check the spaces inside the quotes." };
  if (!/^(console\.log|setText)\(/.test(n.code)) return { ok:false, msg: ex.answers[0].startsWith("setText") ? "Start your line with setText." : "Start your line with console.log." };
  return { ok:false, msg:"Not yet. Read the task again and compare it to your line." };
}
function checkShow(ex, raw){
  const v = raw.trim();
  if (!v) return { ok:false, msg:"Type what the console shows first." };
  if (ex.answers.includes(v)) return { ok:true };
  if (ex.wrong && ex.wrong[v]) return { ok:false, msg:ex.wrong[v] };
  const unq = v.replace(/^["']|["']$/g, "");
  if (ex.answers.includes(unq)) return { ok:false, msg:"Close. The console does not show the quotes." };
  if (ex.answers.some(a => a.toLowerCase() === v.toLowerCase())) return { ok:false, msg:"Check capital letters." };
  if (ex.answers.some(a => a.replace(/\s/g,"") === v.replace(/\s/g,""))) return { ok:false, msg:"Check the spaces. The console shows spaces exactly as they are in the strings." };
  return { ok:false, msg:"Not yet. Look at the quotes, then try again." };
}

/* ---------- rendering ---------- */
function currentTopic(){ const h = location.hash.slice(1); return TOPICS.some(t => t.id === h) ? h : "strings"; }
function doneIn(t){ return EX.filter(e => e.topic === t && state.done[e.id]).length; }

function renderHeader(){
  const segs = $("#segs"); segs.innerHTML = "";
  for (const t of TOPICS){
    const g = el("div", {class:"seg-group"});
    for (const e of EX.filter(x => x.topic === t.id)) g.append(el("span", {class:"seg" + (state.done[e.id] ? " on" : "")}));
    segs.append(g);
  }
  const total = Object.keys(state.done).filter(k => state.done[k]).length;
  $("#progText").textContent = total === EX.length ? `All ${EX.length} done. Nice work.` : `${total} of ${EX.length} done`;
  const tabs = $("#tabs"); tabs.innerHTML = "";
  const cur = currentTopic();
  TOPICS.forEach((t, ti) => {
    const d = doneIn(t.id);
    tabs.append(el("a", {class:"tab", href:"#" + t.id, "aria-current": t.id === cur ? "page" : false},
      el("span", {class:"n", "aria-hidden":"true"}, String(ti+1)), t.name, el("span", {class:"count"}, `${d}/5`), d === 5 ? el("span", {html:ICON_OK, "aria-label":"done"}) : null));
  });
}

function feedbackNode(){ return el("div", {class:"feedback", role:"status", "aria-live":"polite"}); }
function setFeedback(node, ok, msg){
  node.className = "feedback " + (ok ? "ok" : "no");
  node.innerHTML = (ok ? ICON_OK : ICON_NO);
  node.append(el("span", {}, ok ? "Correct." : msg));
}

function whyBox(ex, reveal){
  const box = el("div", {class:"why" + (reveal ? " reveal" : "")});
  box.append(el("p", {class:"label"}, reveal ? "Answer" : "Why it works"));
  if (reveal){
    if (ex.kind === "sort") box.append(el("p", {}, ex.items.map(([v,a]) => `${v} is ${ex.options[a].toLowerCase()}`).join(". ") + "."));
    else if (ex.kind === "show") box.append(el("p", {}, "The console shows: "), codeBlock(ex.answers[0]));
    else box.append(codeBlock(ex.model), el("p", {}, "Type it in yourself, then click Check."));
  }
  box.append(el("p", {html:ex.why}));
  return box;
}

function renderExercise(ex, idx){
  const done = !!state.done[ex.id];
  const tile = el("article", {class:"tile ex" + (done ? " done" : ""), id:"ex-" + ex.id, "aria-labelledby":"h-" + ex.id});
  tile.append(el("div", {class:"ex-top"},
    el("div", {class:"ex-kind"}, el("span", {class:"ex-num", "aria-hidden":"true"}, String(idx+1)),
      el("h3", {id:"h-" + ex.id}, el("span", {class:"label"}, KIND[ex.kind]))),
    done ? el("span", {class:"status", html: ICON_OK + "<span>Done</span>"}) : null));
  tile.append(el("p", {class:"prompt", html:ex.prompt}));
  if (ex.code && ex.kind !== "fix") tile.append(codeBlock(ex.code));

  const fb = feedbackNode();
  const area = el("div", {class:"why-slot"});
  const btns = el("div", {class:"btn-row"});
  const showBtn = el("button", {class:"btn", type:"button", hidden: (misses[ex.id]||0) < 2 || done}, "Show answer");
  showBtn.addEventListener("click", () => { area.innerHTML = ""; area.append(whyBox(ex, true)); showBtn.hidden = true; });

  function miss(){ misses[ex.id] = (misses[ex.id]||0) + 1; if (misses[ex.id] >= 2 && !state.done[ex.id]) showBtn.hidden = false; }
  function win(){
    state.done[ex.id] = true; save();
    area.innerHTML = ""; area.append(whyBox(ex, false));
    showBtn.hidden = true;
    tile.classList.add("done");
    if (!tile.querySelector(".status")) tile.querySelector(".ex-top").append(el("span", {class:"status", html: ICON_OK + "<span>Done</span>"}));
    renderHeader();
    if (doneIn(ex.topic) === 5) renderTopic();
  }

  if (ex.kind === "sort"){
    picks[ex.id] = picks[ex.id] || {};
    const list = el("ul", {class:"sort-list"});
    ex.items.forEach(([val], i) => {
      const mark = el("span", {class:"mark", "aria-live":"polite"});
      const group = el("div", {class:"choices", role:"group", "aria-label": `Choose for ${val}`});
      ex.options.forEach((opt, oi) => {
        const pressed = done ? ex.items[i][1] === oi : picks[ex.id][i] === oi;
        const b = el("button", {class:"choice", type:"button", "aria-pressed": String(pressed)}, opt);
        b.addEventListener("click", () => {
          picks[ex.id][i] = oi;
          group.querySelectorAll(".choice").forEach((c, ci) => c.setAttribute("aria-pressed", String(ci === oi)));
          mark.className = "mark"; mark.innerHTML = "";
        });
        group.append(b);
      });
      group.append(mark);
      const v = el("code", {class:"sort-val inline-code"}); v.append(highlight(val));
      list.append(el("li", {class:"sort-row"}, el("div", {class:"sort-cell"}, v), group));
    });
    tile.append(list);
    const check = el("button", {class:"btn primary", type:"button"}, "Check");
    check.addEventListener("click", () => {
      const p = picks[ex.id];
      if (ex.items.some((_, i) => p[i] == null)){ setFeedback(fb, false, "Pick an answer for every value first."); return; }
      let wrong = 0;
      list.querySelectorAll(".mark").forEach((m, i) => {
        const ok = p[i] === ex.items[i][1]; if (!ok) wrong++;
        m.className = "mark " + (ok ? "ok" : "no");
        m.innerHTML = (ok ? ICON_OK : ICON_NO) + `<span>${ok ? "Right" : "Try again"}</span>`;
      });
      if (wrong === 0){ setFeedback(fb, true, ""); win(); }
      else { setFeedback(fb, false, `${wrong} ${wrong === 1 ? "answer needs" : "answers need"} another look. Check for quotes.`); miss(); }
    });
    btns.append(check, showBtn);
  } else {
    const inputId = "in-" + ex.id;
    const labelText = ex.kind === "show" ? "The console shows" : ex.kind === "fix" ? "Fix this line" : "Your line of code";
    const start = draft[ex.id] ?? (done ? (ex.kind === "show" ? ex.answers[0] : ex.model) : (ex.kind === "fix" ? ex.code : ""));
    const input = el("textarea", {class:"answer", id:inputId, rows:"1", autocomplete:"off", autocapitalize:"off", autocorrect:"off", spellcheck:"false",
      placeholder: ex.kind === "show" ? "Type it exactly" : ex.kind === "write" ? "Type one line of code" : ""});
    input.value = start;
    const fit = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + 6 + "px"; };
    input.addEventListener("input", () => { input.value = input.value.replace(/\n/g, " "); draft[ex.id] = input.value; fit(); });
    requestAnimationFrame(fit); window.addEventListener("resize", fit);
    const check = el("button", {class:"btn primary", type:"button"}, "Check");
    const run = () => {
      const r = ex.kind === "show" ? checkShow(ex, input.value) : checkCode(ex, input.value);
      if (r.ok){ setFeedback(fb, true, ""); win(); } else { setFeedback(fb, false, r.msg); miss(); }
    };
    check.addEventListener("click", run);
    input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); run(); } });
    tile.append(el("div", {class:"field"}, el("label", {for:inputId}, labelText), input));
    btns.append(check);
    if (ex.kind === "fix"){
      const reset = el("button", {class:"btn", type:"button"}, "Reset line");
      reset.addEventListener("click", () => { input.value = ex.code; draft[ex.id] = ex.code; fit(); input.focus(); });
      btns.append(reset);
    }
    btns.append(showBtn);
  }
  tile.append(btns, fb, area);
  if (done) area.append(whyBox(ex, false));
  return tile;
}

function renderTopic(){
  const id = currentTopic();
  const t = TOPICS.find(x => x.id === id);
  const sec = $("#topic"); sec.innerHTML = "";
  const v = el("div", {class:"tile vocab"});
  v.append(el("h2", {}, t.name), el("p", {class:"label"}, "Vocab"));
  const dl = el("dl");
  t.vocab.forEach(([term, def]) => dl.append(el("div", {}, el("dt", {html:term}), el("dd", {html:def}))));
  v.append(dl);
  sec.append(v);
  EX.filter(e => e.topic === id).forEach((e, i) => sec.append(renderExercise(e, i)));
  const ti = TOPICS.findIndex(x => x.id === id);
  const row = el("div", {class:"next-row"});
  const allDone = Object.values(state.done).filter(Boolean).length === EX.length;
  if (doneIn(id) === 5) row.append(el("p", {class:"topic-done", html: ICON_OK + `<span>${allDone ? "You finished all 25. Nice work." : "All 5 done in " + t.name + "."}</span>`}));
  if (ti < TOPICS.length - 1){
    const nx = TOPICS[ti+1];
    row.append(el("a", {class:"btn primary", href:"#" + nx.id, style:"text-decoration:none;display:inline-flex;align-items:center"}, `Next: ${nx.name}`));
  }
  sec.append(row);
}

function render(){ renderHeader(); renderTopic(); }
window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); });

$("#fsBtn").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const p = document.documentElement.requestFullscreen?.(); if (p && p.catch) p.catch(() => {}); }
  } catch(e){}
});
let clearArmed = false;
$("#clearBtn").addEventListener("click", e => {
  if (!clearArmed){ clearArmed = true; e.target.textContent = "Click again to clear everything"; return; }
  clearArmed = false; e.target.textContent = "Clear my progress";
  state = { done:{} }; for (const k in misses) delete misses[k]; for (const k in draft) delete draft[k]; for (const k in picks) delete picks[k];
  save(); render();
});
render();
</script>
</body>
